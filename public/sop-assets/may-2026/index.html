<!doctype html>
<html lang="zh-CN">

  <meta charset="utf-8" />

  <title>May 2026 SOP Image Assets</title>
  <style>
    :root {
      color: #172033;
      background: #f6f7f9;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      padding: 28px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      line-height: 1.2;
    }
    p {
      margin: 0 0 22px;
      color: #5c667a;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }
    figure {
      margin: 0;
      border: 1px solid #d9dee8;
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }
    a {
      display: block;
      color: inherit;
      text-decoration: none;
    }
    img {
      display: block;
      width: 100%;
      height: 220px;
      object-fit: contain;
      background: #fff;
      border-bottom: 1px solid #e8ebf1;
    }
    figcaption {
      padding: 10px 12px 12px;
      font-size: 13px;
      line-height: 1.4;
    }
    strong {
      display: block;
      font-size: 14px;
      margin-bottom: 2px;
    }
    span {
      color: #667085;
    }
  </style>
</head>
