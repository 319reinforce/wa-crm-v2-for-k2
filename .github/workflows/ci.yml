# PR workflow: build + push wa-crm image + deploy to krev.
# 触发：
#   - pull_request → main：PR 过程中每次 push 都会跑一次（预览构建）
#   - push → main：PR 合并进 main 后再跑一次（构建 + 更新 deploy/values-prod.yaml + 部署 krev）
#   - workflow_dispatch：手动重跑
# 参考 K2Lab/keeper/.gitea/workflows/test-backend-build.yaml
name: test-wa-crm-build

on:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/**"
      - "server/**"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "db.js"
      - "schema.sql"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "vite.config.js"
      - "postcss.config.mjs"
      - "tailwind.config.js"
      - "systemPromptBuilder.cjs"
      - "migrate-*.js"
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/**"
      - "server/**"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "db.js"
      - "schema.sql"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "vite.config.js"
      - "postcss.config.mjs"
      - "tailwind.config.js"
      - "systemPromptBuilder.cjs"
      - "migrate-*.js"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: git.k2lab.ai
          username: ${{ github.actor }}
          password: ${{ secrets.RUNNER_PAT }}

      - name: Set Tag
        id: set_tag
        run: |
          SHORT_SHA="$(echo ${{ github.sha }} | cut -c1-7)"
          DATE_TAG="$(date +%Y%m%d)-${SHORT_SHA}"
          echo "tag=${DATE_TAG}" >> $GITHUB_OUTPUT
          echo "::set-output name=tag::${DATE_TAG}"
          echo "${DATE_TAG}" > wa_crm_tag.txt
          echo "Generated tag: ${DATE_TAG}"

      - name: Build and push
        run: |
          DATE_TAG="${{ steps.set_tag.outputs.tag }}"
          IMAGE="git.k2lab.ai/k2lab/wa-crm"
          docker build -t "${IMAGE}:${DATE_TAG}" -t "${IMAGE}:latest" -f Dockerfile .
          docker push "${IMAGE}:${DATE_TAG}"
          docker push "${IMAGE}:latest"

      - name: Upload Tag Artifact
        uses: actions/upload-artifact@v3
        with:
          name: wa-crm-tag
          path: wa_crm_tag.txt

      - name: Update last-built tag marker
        if: github.event_name == 'push'
        run: |
          curl -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
               -o update-tag.sh \
               https://git.k2lab.ai/K2Lab/moras-composer/raw/branch/main/scripts/update-tag.sh
          chmod +x update-tag.sh
          ./update-tag.sh deploy/values-prod.yaml "${{ steps.set_tag.outputs.tag }}"

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download Tag Artifact
        uses: actions/download-artifact@v3
        with:
          name: wa-crm-tag

      - name: Read Tag
        run: echo "TAG=$(cat wa_crm_tag.txt)" >> $GITHUB_ENV

      - name: Deploy to krev
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.KREV_SERVER_HOST }}
          username: ${{ secrets.KREV_SERVER_USER }}
          key: ${{ secrets.KREV_SERVER_SSH_KEY }}
          envs: TAG
          script: |
            echo "Deploying wa-crm:${TAG} to krev"
            cd ~/whatsapp-mgr
            git pull origin main
            docker pull git.k2lab.ai/k2lab/wa-crm:${TAG}
            sed -i "s|image: git.k2lab.ai/k2lab/wa-crm:.*|image: git.k2lab.ai/k2lab/wa-crm:${TAG}|" docker-compose.krev.override.yml
            docker compose -f docker-compose.server.yml -f docker-compose.krev.override.yml up -d
            sleep 3
            curl -sf http://localhost:3000/api/health && echo "Health check passed"
